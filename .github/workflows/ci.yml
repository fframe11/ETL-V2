name: CI
on: [push, pull_request]

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          ELASTICSEARCH_HOST=elasticsearch
          ELASTICSEARCH_PORT=9200
          SPARK_MASTER_HOST=spark-master
          SPARK_MASTER_PORT=7077
          KIBANA_PORT=5601
          GRAFANA_PORT=3002
          N8N_PORT=5678
          API_PORT=8002
          EOF

      - name: Validate Docker Compose file
        run: docker compose -f docker-compose.yml config

      - name: Check Python syntax
        run: |
          python -m py_compile services/api/main.py services/api/seed_es.py services/spark/spark_quality_engine.py services/spark/streaming_job.py services/spark/reddit_stream.py

      - name: Check UI manifest
        run: test -f services/ui/package.json && test -f services/ui/package-lock.json

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install API dependencies
        working-directory: services/api
        run: |
          pip install -r requirements.txt pandas pyarrow openpyxl xlrd psycopg2-binary pytest "httpx<0.28"
      - name: Run API tests
        working-directory: services/api
        env:
          SESSION_SECRET_KEY: ci-only-secret
          ADMIN_USERNAME: ci
          ADMIN_PASSWORD: ci
          ELASTICSEARCH_HOST: localhost
          ELASTICSEARCH_PORT: "9200"
          ELASTICSEARCH_USER: elastic
          ELASTICSEARCH_PASSWORD: ci
          EVAL_DATASET_ZIP: ${{ github.workspace }}/data/evaluation/student_course_score_evaluation_dataset.zip
        run: python -m pytest -q

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and test UI
        working-directory: services/ui
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci
          npm test

  spark-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PySpark + Delta
        run: pip install pyspark==3.4.1 delta-spark==2.4.0 requests pyyaml pytest
      - name: Run Spark unit tests
        working-directory: services/spark
        env:
          PYSPARK_SUBMIT_ARGS: "--packages io.delta:delta-core_2.12:2.4.0 --conf spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog pyspark-shell"
          ELASTICSEARCH_PASSWORD: ci
          HDFS_URL: hdfs://localhost:9000
          N8N_WEBHOOK_URL: http://localhost:5678
        run: python -m pytest -q tests/unit
