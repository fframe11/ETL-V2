# fly.toml app configuration file for Fly.io Singapore deployment
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "dataserve-api-sg"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  CORS_ALLOWED_ORIGINS = "https://etl-v2.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
