events {
    worker_connections 1024;
}

http {
    client_max_body_size 1G;

    # Root Cause Fix: a static `upstream { server api:8000; }` block resolves the
    # hostname once at nginx startup and caches that container IP for the worker
    # process's lifetime. Any time the api/ui container is recreated (rebuild, restart,
    # deploy) it gets a new Docker-assigned IP, and nginx kept proxying to the old
    # (now-dead) IP until nginx itself was manually restarted — observed directly as
    # repeated 502s during this session. Using Docker's embedded DNS resolver with a
    # short TTL and a variable in proxy_pass makes nginx re-resolve periodically instead.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        location /api/ {
            set $upstream_api api:8000;
            proxy_pass http://$upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            set $upstream_ui ui:80;
            proxy_pass http://$upstream_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
